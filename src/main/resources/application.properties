spring.application.name=ms-pedidos-innovatech
spring.profiles.default=local
server.port=${SERVER_PORT:8082}
jwt.secret=${JWT_SECRET:change-me-jwt-secret-min-32-chars}

spring.jpa.hibernate.ddl-auto=update
