spring.application.name=ms-pedidos-innovatech
spring.profiles.default=dev

server.port=${SERVER_PORT:8082}
jwt.secret=${JWT_SECRET}
app.security.docs-public=${APP_SECURITY_DOCS_PUBLIC:false}
logging.pattern.level=%5p [requestId=%X{requestId:-na}]
pedido.rabbitmq.exchange=${PEDIDO_RABBITMQ_EXCHANGE:pedido.exchange}
pedido.rabbitmq.queue=${PEDIDO_RABBITMQ_QUEUE:pedido.pagado.queue}
pedido.rabbitmq.routing-key=${PEDIDO_RABBITMQ_ROUTING_KEY:pedido.pagado}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
