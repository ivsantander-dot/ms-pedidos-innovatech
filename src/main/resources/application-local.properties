spring.datasource.url=jdbc:mysql://${DB_HOST:${PEDIDOS_MYSQL_HOST:localhost}}:${DB_PORT:${PEDIDOS_MYSQL_PORT:3306}}/${DB_NAME:${PEDIDOS_MYSQL_DATABASE:innovatech_pedidos}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${PEDIDOS_MYSQL_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${PEDIDOS_MYSQL_PASSWORD:change_me_local_pedidos}}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
